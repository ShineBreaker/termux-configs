# Termux tmux 配置 — 移植自 Guix-configs 的桌面终端配置，按移动端取舍。
# 桌面用 C-x 作前缀，这里保留 tmux 默认的 C-b（更好按，且不与桌面冲突）。
# 未移植的部分：侧边栏（Guile 长驻进程）、Wayland 剪贴板 (wl-copy/wl-paste)、
# herdr 会话选择器 —— 这些依赖桌面环境；移动端以 OSC52 + 可选 termux-clipboard
# （装了 Termux:API 应用时）替代系统剪贴板。

# ========== 基础设置 ==========
# Termux 的 ncurses 提供 tmux-256color；外层终端能力由 tmux 自动探测。
set -g default-terminal "tmux-256color"
# 附着新客户端时同步其环境变量（含 Termux 标识），便于 pane 内识别外层环境。
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY COLORTERM TERMUX_VERSION"

# 前缀键保留 C-b；再按一次 C-b 发送字面 C-b 给 pane。
set -g prefix C-b
bind C-b send-prefix

# 窗口/窗格从 1 开始编号，并自动重新编号。
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# ========== 顶部状态条 (小屏紧凑) ==========
# 左：前缀提示 + 会话名 + 客户端短号；右：时间 + 内存占用。
# 会话名后的 ·<N> 是当前标签页的客户端号（#{b:client_tty}，即 pts/N），
# 共享 main 会话时用它区分不同标签页。
# 注意：conditional (#{?}) 的分支里不能出现 #[fg=...,bold] 这种带逗号的样式，
# 会被当成参数分隔符（会渲染出字面 "bold]"），所以样式统一放在条件外。
set -g status on
set -g status-position top
set -g status-justify left
set -g status-style bg=default,fg=brightwhite
set -g status-left-length 30
set -g status-right-length 40
set -g status-left '#{?client_prefix,#[fg=brightred][PREFIX] ,}#[fg=#{?client_prefix,brightred,brightgreen},bold]#S·#{b:client_tty} '
set -g status-right '#[fg=brightwhite]%H:%M #[fg=brightyellow]#(~/.config/tmux/scripts/mem-status) '
set -g window-status-format ' #[fg=brightblack]#I:#W '
set -g window-status-current-format ' #[fg=brightwhite,bold]#I:#W '
set -g window-status-separator ''
set -g status-interval 5

# 窗格边框
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=brightblue
set -g display-panes-time 1200

# ========== 键位绑定 ==========
# 重新加载配置
bind r source-file ~/.config/tmux/tmux.conf \; display "配置已重载！"
# 快捷键速查 (float 弹窗)
bind \? display-popup -E -w 92% -h 80% -b rounded "bash ~/.config/tmux/scripts/which-key"

# 分屏（保持当前路径）；禁用默认的 % 与 "
bind \\ split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 前缀 + hjkl 切换窗格 (Vi 风格)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt+方向键：无需前缀直接切换窗格 (Termux 音量- = Alt)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Ctrl+方向键：无需前缀，微调窗格大小 (Termux 音量+ = Ctrl)
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

# 窗口/会话管理：c 新建窗口，x 关窗格，X 关窗口，K 关会话，C 新建会话
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
bind X kill-window
bind K kill-session
bind C new-session

# 会话/窗口浮窗选择器（替代默认的整屏 choose-tree，移动端更好看）
bind s display-popup -E -w 90% -h 70% -b rounded "tmux choose-tree -Zs"

# fzf 模糊跳转任意 session 的窗口
bind f display-popup -E -w 80% -h 60% -b rounded "bash ~/.config/tmux/scripts/window-jump"

# Alt+数字：无需前缀，快速切换窗口
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# 无前缀的历史/搜索/命令入口（沿用桌面习惯）
bind -n M-H copy-mode -u
bind -n M-F command-prompt -i -p "搜索回滚" "copy-mode \; send-keys -X search-backward '%%'"
bind -n M-/ command-prompt -p "tmux 命令" "%%"

# ========== 鼠标支持 ==========
set -g mouse on

# 滚轮：全屏程序 (less/vim) 直接转发；否则进入 copy-mode 滚动
bind-key -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "copy-mode -e; send-keys -X scroll-up"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "if-shell -F '#{pane_in_mode}' 'send-keys -X scroll-down' 'copy-mode -e; send-keys -X scroll-down'"

# ========== 复制模式 (Vi 风格 + Android 剪贴板) ==========
setw -g mode-keys vi

bind [ copy-mode
bind Escape copy-mode
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi v send-keys -X begin-selection
# y/Enter/鼠标拖拽结束 → 写入 tmux 缓冲并尝试 OSC52 同步系统剪贴板；
# 若装了 Termux:API 应用，再由 clipboard-copy 额外写入 Android 剪贴板。
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "bash ~/.config/tmux/scripts/clipboard-copy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "bash ~/.config/tmux/scripts/clipboard-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "bash ~/.config/tmux/scripts/clipboard-copy"

# 粘贴：优先取 Android 剪贴板，失败则粘贴 tmux 自身缓冲
bind p run-shell "bash ~/.config/tmux/scripts/paste-clipboard"
bind -n S-Insert run-shell "bash ~/.config/tmux/scripts/paste-clipboard"

# ========== 性能与集成 ==========
# 历史记录上限（回溯能力 vs 内存，移动端取 2 万行）
set -g history-limit 20000

# Escape 超时归零，避免 Alt 组合延迟
set -sg escape-time 0
# 重复前缀键的操作时间窗口（毫秒）
set -g repeat-time 300
# 让终端感知 tmux 焦点变化（IDE/agent 集成）
set -g focus-events on

# ========== 窗口管理 ==========
# 窗口名跟随当前路径 basename
setw -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'

# 终端标题显示 会话·客户端 : 窗口 (如 main·0:fish)
set -g set-titles on
set -g set-titles-string '#S·#{b:client_tty}:#I:#W'

# ========== 其他设置 ==========
# 允许 OSC52 通过外层终端设置剪贴板
set -s set-clipboard on
# 消息显示时长 2 秒
set -g display-time 2000

# ========== Pi Agent 适配 ==========
# 扩展按键序列，便于 Pi 等 TUI 识别修饰键
set -g extended-keys on
set -g extended-keys-format csi-u
