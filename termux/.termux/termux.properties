# Termux 应用配置文件
# 修改后运行 `termux-reload-settings` 生效，部分设置需重启应用
# 完整选项见 https://wiki.termux.com/wiki/Terminal_Settings

# 允许外部应用在 Termux 中执行命令
# 安全提示：开启后外部应用可执行任意命令，仅在需要时开启
allow-external-apps = true

# 快捷键栏图标风格（当前使用 Termux 默认快捷键栏）
extra-keys-style = default

# 快捷键栏按钮文字是否全部大写
extra-keys-text-all-caps = false
